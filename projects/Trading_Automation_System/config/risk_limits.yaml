# 风控限额配置
# 所有比例基于账户总权益 (total_eq)

risk_limits:
  # === 单策略限额 ===
  max_strategy_allocation_pct: 0.10      # 单策略占总权益上限 10%
  max_strategy_drawdown_pct: 0.15        # 单策略最大回撤 15%
  
  # === 单品种限额 ===
  max_instrument_exposure_pct: 0.20      # 单品种敞口上限 20%
  max_instrument_correlation: 0.70       # 相关性上限 0.7
  
  # === 账户级限额 ===
  max_account_drawdown_pct: 0.10         # 账户最大回撤 10%
  max_total_leverage: 3.0                # 总杠杆上限 3x
  min_free_margin_pct: 0.10              # 最小可用保证金比例 10%
  
  # === 单笔交易限额 ===
  max_order_value_pct: 0.05              # 单笔订单占权益上限 5%
  max_slippage_bps: 50                   # 最大滑点 50bp
  
  # === 频率限制 ===
  max_orders_per_minute: 30              # 每分钟最大下单数
  max_orders_per_hour: 500               # 每小时最大下单数


# === 熔断配置 ===
circuit_breaker:
  failure_threshold: 5       # 连续失败次数触发熔断
  recovery_timeout_sec: 300  # 熔断恢复超时 5分钟
  half_open_max_tries: 3     # 半开状态最大尝试次数