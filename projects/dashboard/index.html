
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEO COMMAND CENTER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: #e5e5e5; font-family: 'Inter', sans-serif; }
        .status-card { background: rgba(20, 20, 20, 0.8); border: 1px solid #333; border-radius: 1rem; }
        .led-green { color: #10b981; text-shadow: 0 0 8px #10b981; }
        .led-yellow { color: #f59e0b; text-shadow: 0 0 8px #f59e0b; }
    </style>
</head>
<body class="p-8">
    <div class="flex justify-between items-center mb-10">
        <h1 class="text-3xl font-black tracking-tighter text-pink-500">LEO COMMAND CENTER <span class="text-xs text-zinc-500 font-normal ml-2">v1.0</span></h1>
        <div id="server-time" class="text-zinc-500 font-mono">--:--:--</div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="status-card p-6">
            <h2 class="text-sm font-bold text-zinc-400 mb-4 uppercase tracking-widest">Agent Status</h2>
            <div id="agent-list" class="space-y-3"></div>
        </div>

        <div class="status-card p-6">
            <h2 class="text-sm font-bold text-zinc-400 mb-4 uppercase tracking-widest">Active Pipeline</h2>
            <div id="pipeline-status" class="text-2xl font-bold text-white">Idle</div>
            <div class="w-full bg-zinc-800 h-2 rounded-full mt-4 overflow-hidden">
                <div id="progress-bar" class="bg-pink-600 h-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>

        <div class="status-card p-6">
            <h2 class="text-sm font-bold text-zinc-400 mb-4 uppercase tracking-widest">Asset Growth</h2>
            <div class="grid grid-cols-2 gap-4">
                <div class="text-center"><p class="text-xs text-zinc-500">USDT</p><p id="val-usdt" class="text-xl font-bold">0.00</p></div>
                <div class="text-center"><p class="text-xs text-zinc-500">TOOLS</p><p id="val-tools" class="text-xl font-bold">0</p></div>
            </div>
        </div>
    </div>

    <script>
        async function update() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                const agentDiv = document.getElementById('agent-list');
                agentDiv.innerHTML = '';
                for (const [name, status] of Object.entries(data.agents)) {
                    agentDiv.innerHTML += `<div class="flex justify-between items-center">
                        <span>${name}</span>
                        <span class="${status === 'Active' ? 'led-green' : 'led-yellow'}">● ${status}</span>
                    </div>`;
                }
                document.getElementById('pipeline-status').innerText = data.pipeline || 'Idle';
                document.getElementById('progress-bar').style.width = (data.progress || 0) + '%';
                document.getElementById('val-usdt').innerText = data.metrics?.usdt || '0.00';
                document.getElementById('val-tools').innerText = data.metrics?.tools || '0';
                document.getElementById('server-time').innerText = new Date().toLocaleTimeString();
            } catch (e) { console.error(e); }
        }
        setInterval(update, 2000);
        update();
    </script>
</body>
</html>
